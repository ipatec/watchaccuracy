<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f0f14">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Measure and track your watch accuracy over time.">
  <title>WatchAccuracy</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div id="app">
  <header>
    <button class="back-btn" aria-label="Go back">‹</button>
    <h1>⌚ WatchAccuracy</h1>
  </header>

  <main id="main">
    <p class="text-muted text-center mt-16">Loading…</p>
  </main>

  <!-- Bottom navigation -->
  <nav class="nav-tabs">
    <button class="nav-tab active" id="tab-home" data-href="#/" aria-label="My Watches">
      <span class="icon">⌚</span>
      Watches
    </button>
    <button class="nav-tab" id="tab-leaderboard" data-href="#/leaderboard" aria-label="Leaderboard">
      <span class="icon">🏆</span>
      Leaderboard
    </button>
    <button class="nav-tab" id="tab-settings" data-href="#/settings" aria-label="Settings">
      <span class="icon">⚙️</span>
      Settings
    </button>
  </nav>
</div>

<!-- ─── Add Watch Modal ──────────────────────────────────────────────────── -->
<div class="modal-overlay" id="modal-add-watch" role="dialog" aria-modal="true" aria-labelledby="aw-title">
  <div class="modal-sheet">
    <div class="modal-header">
      <h2 id="aw-title">Add Watch</h2>
      <button class="modal-close" onclick="closeModal('modal-add-watch')" aria-label="Close">✕</button>
    </div>
    <div class="form-group">
      <label for="aw-brand">Brand</label>
      <input type="text" id="aw-brand" placeholder="e.g. Seiko, Rolex, Casio…" autocomplete="off">
    </div>
    <div class="form-group">
      <label for="aw-model">Model</label>
      <input type="text" id="aw-model" placeholder="e.g. SKX007, Submariner…" autocomplete="off">
    </div>
    <div class="form-group">
      <label for="aw-notes">Notes (optional)</label>
      <textarea id="aw-notes" placeholder="Movement, year, condition…"></textarea>
    </div>
    <div class="form-group flex-row">
      <input type="checkbox" id="aw-public" style="width:auto">
      <label for="aw-public" style="text-transform:none;font-size:.9rem;color:var(--text)">
        Make public (share tracker &amp; contribute to leaderboard)
      </label>
    </div>
    <button class="btn btn-primary btn-block" onclick="submitAddWatch()">Add Watch →</button>
  </div>
</div>

<!-- ─── Edit Watch Modal ─────────────────────────────────────────────────── -->
<div class="modal-overlay" id="modal-edit-watch" role="dialog" aria-modal="true" aria-labelledby="ew-title">
  <div class="modal-sheet">
    <div class="modal-header">
      <h2 id="ew-title">Edit Watch</h2>
      <button class="modal-close" onclick="closeModal('modal-edit-watch')" aria-label="Close">✕</button>
    </div>
    <input type="hidden" id="ew-watchid">
    <div class="form-group">
      <label for="ew-brand">Brand</label>
      <input type="text" id="ew-brand" autocomplete="off">
    </div>
    <div class="form-group">
      <label for="ew-model">Model</label>
      <input type="text" id="ew-model" autocomplete="off">
    </div>
    <div class="form-group">
      <label for="ew-notes">Notes</label>
      <textarea id="ew-notes"></textarea>
    </div>
    <div class="form-group flex-row">
      <input type="checkbox" id="ew-public" style="width:auto">
      <label for="ew-public" style="text-transform:none;font-size:.9rem;color:var(--text)">
        Public (shareable &amp; leaderboard)
      </label>
    </div>
    <button class="btn btn-primary btn-block" onclick="submitEditWatch()">Save Changes</button>
    <button class="btn btn-danger btn-block" onclick="deleteWatch(document.getElementById('ew-watchid').value)">Delete Watch</button>
  </div>
</div>

<!-- ─── Image preview modal ───────────────────────────────────────────────── -->
<div id="img-modal" role="dialog" aria-modal="true" aria-label="Photo preview">
  <img src="" alt="Watch photo">
  <button id="img-modal-close" aria-label="Close">✕</button>
</div>

<!-- ─── Toast ─────────────────────────────────────────────────────────────── -->
<div id="toast" role="status" aria-live="polite"></div>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
<!-- Tesseract.js (OCR for reading watch time from photos) -->
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<!-- App -->
<script src="/js/app.js"></script>
</body>
</html>
